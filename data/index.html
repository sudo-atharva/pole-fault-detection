<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pole Fault Monitor</title>
<style>
  body{font-family:sans-serif;background:#111;color:#eee;margin:0;padding:16px}
  h1{font-size:1.2em}
  .card{background:#1c1c1c;border-radius:8px;padding:12px 16px;margin:8px 0}
  .label{color:#888;font-size:.85em}
  .value{font-size:1.6em}
  .ok{color:#4caf50}
  .bad{color:#f44336}
</style>
</head>
<body>
<h1>Pole Fault Monitor</h1>
<div class="card"><div class="label">Voltage</div><div class="value" id="voltage">--</div></div>
<div class="card"><div class="label">Current</div><div class="value" id="current">--</div></div>
<div class="card"><div class="label">Tilt (from baseline)</div><div class="value" id="tilt">--</div></div>
<div class="card"><div class="label">Relay</div><div class="value" id="relay">--</div></div>
<div class="card"><div class="label">Fault reason</div><div class="value" id="reason">--</div></div>
<div class="card"><div class="label">GPS</div><div class="value" id="gps">--</div></div>

<script>
async function poll() {
  try {
    const r = await fetch('/data');
    const d = await r.json();
    document.getElementById('voltage').textContent = d.voltage + ' V';
    document.getElementById('current').textContent = d.current + ' A';
    document.getElementById('tilt').textContent = d.tilt + ' deg';
    const relayEl = document.getElementById('relay');
    relayEl.textContent = d.relay;
    relayEl.className = 'value ' + (d.tripped ? 'bad' : 'ok');
    document.getElementById('reason').textContent = d.reason || 'none';
    document.getElementById('gps').textContent = d.gps;
  } catch (e) { /* AP client momentarily disconnected, retry next tick */ }
}
setInterval(poll, 1000);
poll();
</script>
</body>
</html>
